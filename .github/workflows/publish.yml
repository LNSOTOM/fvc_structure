# Publish fvc3d to PyPI when a GitHub release is published.
# Uses PyPI trusted publishing: no API token is stored anywhere. The PyPI
# project "fvc3d" trusts this repository, this workflow file and the
# "pypi" environment.

name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build

      - name: Check metadata
        run: twine check --strict dist/*

      - name: Check the release tag matches the package version
        run: |
          version=$(python -c "import glob, re; w = glob.glob('dist/*.whl')[0]; print(re.search(r'fvc3d-([^-]+)-', w).group(1))")
          tag="${GITHUB_REF_NAME#v}"
          echo "package $version, tag $GITHUB_REF_NAME"
          test "$version" = "$tag" || { echo "::error::Tag $GITHUB_REF_NAME does not match package version $version"; exit 1; }

      - name: Smoke test the wheel
        run: |
          python -m pip install dist/*.whl
          python -c "import fvc3d; print('fvc3d', fvc3d.__version__)"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    if: github.repository == 'LNSOTOM/fvc_structure'
    environment:
      name: pypi
      url: https://pypi.org/project/fvc3d/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
