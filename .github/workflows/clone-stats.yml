name: Update clone statistics

on:
  workflow_dispatch:
  schedule:
    - cron: "23 2 * * *"

permissions:
  contents: read

concurrency:
  group: update-clone-statistics
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check traffic token
        env:
          TRAFFIC_TOKEN: ${{ secrets.REPO_TRAFFIC_TOKEN }}
        run: |
          if [ -z "$TRAFFIC_TOKEN" ]; then
            echo "::error::Set the REPO_TRAFFIC_TOKEN repository secret before running this workflow."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.REPO_TRAFFIC_TOKEN }}
      - name: Read and publish the 14-day clone count
        env:
          TRAFFIC_TOKEN: ${{ secrets.REPO_TRAFFIC_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TRAFFIC_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/traffic/clones" > "$RUNNER_TEMP/clones.json"
          python3 - "$RUNNER_TEMP/clones.json" <<'PY'
          import json
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          data = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          count = data["count"]
          if type(count) is not int or not 0 <= count <= 2**53 - 1:
              raise ValueError("GitHub returned an invalid clone count")
          stats = {"count": count, "updatedAt": datetime.now(timezone.utc).isoformat(timespec="seconds")}
          Path("docs/repo-stats.js").write_text(
              f"window.fvcCloneStats = {json.dumps(stats)};\n", encoding="utf-8"
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/repo-stats.js
          git commit -m "Update 14-day clone statistics" -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
          git push origin "HEAD:$DEFAULT_BRANCH"
