# Copy this file to lidar_to_ply.local.yml and replace the paths.
# Input must be a Phase 4 LAS with Z_norm and treeID dimensions.
input_las: /absolute/path/to/structure_tile.las
output_dir: /absolute/path/to/new/output_directory

# historical_five_class: PLY classes 1–5; reproduces the released Zenodo tiles
#   (doi:10.5281/zenodo.24431573) and accepts all sites, including forb.
# three_class_hsm: PLY classes 3–5 (hummock, shrub, mallee); fails on 64 or 65,
#   so it stops on low-site tiles.
class_profile: historical_five_class
