# DVC experiment parameters
# Edit values here, or override via:
#   dvc exp run --set-param train.cuda_devices=0 --set-param train.work_dir=work_dirs/my_run

train:
  # Paths below are relative to ForestFormer3D/ because the DVC stage uses wdir: ForestFormer3D
  config: configs/oneformer3d_qs_radius16_qp300_2many.py
  work_dir: work_dirs/experiments/oneformer3d_qs_radius16_qp300_2many

  # CUDA_VISIBLE_DEVICES value passed to the training command (string so you can do "0,1")
  cuda_devices: "0,1,2,3,4,6,7,8"

test:
  # Config/checkpoint paths are relative to ForestFormer3D/ (DVC stage runs via `cd ForestFormer3D`)
  config: configs/oneformer3d_qs_radius16_qp300_2many.py
  checkpoint: work_dirs/clean_forestformer/epoch_3000_fix.pth

  # Port used for PyTorch distributed rendezvous in `tools/dist_test.sh`.
  # If you see "Address already in use" for 29500, change this.
  port: 29501

  # Deterministic output dirs for test runs (avoids mixing different tests in the default work_dirs)
  work_dir_single: work_dirs/dvc_test/single
  work_dir_dist: work_dirs/dvc_test/dist

  # Stable metrics paths (DVC reads these and shows them in `dvc exp show`)
  metrics_file_single: work_dirs/dvc_test/metrics_single.json
  metrics_file_dist: work_dirs/dvc_test/metrics_dist.json

  # Single-GPU test example:
  #   CUDA_VISIBLE_DEVICES=0 python tools/test.py <config> <checkpoint>
  single_cuda_devices: "0"

  # Distributed test example:
  #   CUDA_VISIBLE_DEVICES=0,1,2,3,4,6,7,8 bash tools/dist_test.sh <config> <checkpoint> 7
  cuda_devices: "0,1,2,3,4,6,7,8"
  gpus: 7
