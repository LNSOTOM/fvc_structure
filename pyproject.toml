[project]
name = "fvc-structure-dsm"
version = "0.1.0"
description = "Reusable DSM generation helpers for georeferenced LAS/LAZ point clouds."
requires-python = ">=3.10,<3.12"
dependencies = [
    "dask>=2024.0",
    "ipykernel>=6.0",
    "jupyterlab>=4.0",
    "laspy>=2.0",
    "matplotlib>=3.8",
    "numpy<2.0",
    "pyproj>=3.6",
    "pyyaml>=6.0",
    "rasterio>=1.3",
    "rioxarray>=0.15",
    "scikit-image>=0.22",
    "scipy>=1.11",
    "tqdm>=4.0",
    "xarray>=2024.0",
]

[tool.uv]
package = false