[project]
name = "fvc3d"
dynamic = ["version"]
description = "Transfer 2D vegetation growth-form labels into georeferenced 3D UAS LiDAR point clouds."
readme = "PYPI_README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Laura N. Sotomayor" }]
requires-python = ">=3.10"
keywords = ["LiDAR", "point cloud", "label transfer", "vegetation structure", "rangeland", "UAS"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "laspy[lazrs]>=2.0",
    "numpy>=1.24",
    "pyproj>=3.6",
    "pyyaml>=6.0",
    "rasterio>=1.3",
    "scikit-image>=0.22",
    "scipy>=1.11",
]

[project.urls]
Documentation = "https://lnsotom.github.io/fvc_structure/"
Source = "https://github.com/LNSOTOM/fvc_structure"
Issues = "https://github.com/LNSOTOM/fvc_structure/issues"
Releases = "https://github.com/LNSOTOM/fvc_structure/releases"
Paper = "https://doi.org/10.31223/X5948M"

[dependency-groups]
# Tools for the phase_* research scripts and notebooks; not needed by fvc3d.
research = [
    # The phase_* scripts were developed on NumPy 1.x and Python 3.10.
    "numpy<2.0",
    "dask>=2024.0",
    "ipykernel>=6.0",
    "jupyterlab>=4.0",
    "matplotlib>=3.8",
    "pandas>=2.0",
    "rioxarray>=0.15",
    "tqdm>=4.0",
    "xarray>=2024.0",
]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/fvc3d/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/fvc3d"]

# The source distribution holds fvc3d only, not the research workflow,
# vendored models or data in the rest of the repository.
[tool.hatch.build.targets.sdist]
include = [
    "/src/fvc3d",
    "/configs/transfer_labels.yaml",
    "/configs/classes.yaml",
    "/examples/transfer_labels.py",
    "/tests",
    "/README.md",
    "/PYPI_README.md",
    "/LICENSE",
    "/CITATION.cff",
]

[tool.uv]
default-groups = ["research", "dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
